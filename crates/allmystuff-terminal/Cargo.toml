[package]
name = "allmystuff-terminal"
description = "Shared PTY terminal sessions and viewer queues with caller-owned task spawning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
host = ["dep:dirs", "dep:parking_lot", "dep:portable-pty", "dep:tracing", "tokio/rt", "tokio/time"]

[dependencies]
allmystuff-byte-queues = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["sync"] }
dirs = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
tracing = { workspace = true, optional = true }
# Preserve the node's PTY fork, version and default features. Its Windows
# default omits PSEUDOCONSOLE_INHERIT_CURSOR, avoiding the cursor handshake
# that otherwise blocks a headless ConPTY before shell output.
portable-pty = { package = "xpty", version = "0.3.6", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
