[package]
name = "allmystuff-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reusable PCM processing, Opus state and optional audio capture/playback."

[features]
default = []
# The node keeps this enabled even when capture and playback are disabled.
codec = ["dep:opus", "dep:allmystuff-session", "dep:tracing"]
# Preserve the node's existing capture/playback feature grouping.
audio-io = ["codec", "dep:cpal", "dep:parking_lot", "dep:libloading"]

[dependencies]
allmystuff-session = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
opus = { version = "0.3", optional = true }
cpal = { version = "0.15", optional = true }
parking_lot = { version = "0.12", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.8", optional = true }

[dev-dependencies]
serde_json.workspace = true
