[package]
name = "allmystuff-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reusable video processing with application-owned transport and routing."

[features]
default = []
# Software receive workers and the existing capture-less control surface.
decode = [
    "dep:openh264", "dep:parking_lot", "dep:serde", "dep:serde_json",
    "dep:allmystuff-session", "dep:allmystuff-bridge",
    "dep:windows", "dep:windows-sys",
]
# Preserve the node's existing capture/encode/backend grouping.
host = [
    "decode", "dep:allmystuff-protocol", "dep:allmystuff-pixels",
    "dep:xcap", "dep:jpeg-encoder", "dep:nokhwa", "dep:enigo",
    "dep:zbus", "dep:pipewire", "dep:xcb", "dep:core-foundation",
    "windows/Win32_Graphics_Direct3D", "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Gdi", "windows/Win32_Media_MediaFoundation",
    "windows/Win32_Media_KernelStreaming", "windows/Win32_System_Com",
    "windows/Win32_System_Variant", "windows/Win32_System_Ole",
    "windows-sys/Win32_System_Power", "windows-sys/Win32_System_Performance",
    "windows-sys/Win32_UI_WindowsAndMessaging",
]
hwenc = ["host", "dep:ffmpeg-next"]

[dependencies]
allmystuff-frame-timing.workspace = true
allmystuff-video-metadata.workspace = true
allmystuff-video-pacing.workspace = true
tracing.workspace = true
allmystuff-session = { workspace = true, optional = true }
allmystuff-bridge = { workspace = true, optional = true }
allmystuff-protocol = { workspace = true, optional = true }
allmystuff-pixels = { path = "../../node/pixels", optional = true }
openh264 = { version = "0.9", optional = true }
parking_lot = { version = "0.12", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
xcap = { version = "0.9", optional = true }
jpeg-encoder = { version = "0.7", features = ["simd"], optional = true }
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
enigo = { version = "0.6", optional = true }
ffmpeg-next = { version = "6.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }
pipewire = { version = "0.9", optional = true }
xcb = { version = "1", features = ["dpms"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Foundation", "Win32_Foundation", "Win32_System_LibraryLoader",
] }
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation", "Win32_Media", "Win32_Security",
    "Win32_System_Threading", "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json.workspace = true
memchr = "2"
tokio.workspace = true
