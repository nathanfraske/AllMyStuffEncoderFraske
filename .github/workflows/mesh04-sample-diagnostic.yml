name: MESH04 isolated sample-write diagnostic

on:
  push:
    branches:
      - agent/1503a621-mesh04-sample-diagnostic

permissions:
  contents: read

jobs:
  sample-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            python: python3
            probe: transport
          - runner: windows-latest
            python: python
            probe: consumer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact source and selected policy bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nathanfraske/MyOwnMeshSecurityReview
          ref: db7818e09fedd98899490347b86ac9bc9f97b59b
          path: target/mesh04-sample-diagnostic-upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run one strict diagnostic pair for the selected probe
        timeout-minutes: 78
        shell: bash
        run: |
          exec ${{ matrix.python }} scripts/ci/mesh-realtime-sample-diagnostic.py \
            --upstream target/mesh04-sample-diagnostic-upstream \
            --expected-app '${{ github.sha }}' \
            --artifacts '${{ runner.temp }}/mesh04-sample-diagnostic-artifacts' \
            --probe-kind '${{ matrix.probe }}' \
            --patch-set 'scripts/ci/myownmesh-corrections/sample-write-provenance.json' \
            --patch-set-sha256 '89b106f03265bf0a1eb95f2ee35b414c2e6229b9ed9d93c22c5c16c171321011'
      - name: Retain complete commands, streams and owned cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh04-sample-diagnostic-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesh04-sample-diagnostic-artifacts
          if-no-files-found: error
          retention-days: 14
