name: MESH04 hosted Intel macOS production consumer qualification

on:
  push:
    branches:
      - agent/1503a621-mesh04-macos-production-qualification

permissions:
  contents: read

jobs:
  production-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            python: python3
            probe: consumer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact source and selected policy bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nathanfraske/MyOwnMeshSecurityReview
          ref: db7818e09fedd98899490347b86ac9bc9f97b59b
          path: target/mesh04-macos-production-consumer-upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run one strict Intel macOS production consumer pair
        timeout-minutes: 78
        shell: bash
        run: |
          exec ${{ matrix.python }} scripts/ci/mesh-realtime-macos-production-consumer.py \
            --upstream target/mesh04-macos-production-consumer-upstream \
            --expected-app '${{ github.sha }}' \
            --artifacts '${{ runner.temp }}/mesh04-macos-production-consumer-artifacts' \
            --probe-kind '${{ matrix.probe }}' \
            --patch-set 'scripts/ci/myownmesh-corrections/inbound-pump-custodian-provenance.json' \
            --patch-set-sha256 '21cd5d2084f3e6bc0b04fbf3052bafa904e3e451003cb0fe44288f83d87ac50c'
      - name: Retain complete commands, streams and owned cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh04-macos-production-consumer-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesh04-macos-production-consumer-artifacts
          if-no-files-found: error
          retention-days: 14
